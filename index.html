<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315d44">
<title>ARUNIKA</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARUNIKA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"></div>
<script>try{if(sessionStorage.getItem('sp')){document.getElementById('splash').remove()}else{sessionStorage.setItem('sp','1')}}catch(e){}</script>

<section id="login" hidden>
  <div class="lw">
    <div class="brand"><img src="logo.png" class="biglogo" alt="Logo"><h1>ARUNIKA</h1><p>Manage Better. Grow Further.</p><span class="gw">Goena<i>work</i></span></div>
    <form id="f">
      <input id="em" type="email" placeholder="Email" required autocomplete="username">
      <input id="pw" type="password" placeholder="Kata sandi" required autocomplete="current-password">
      <div id="err"></div>
      <button class="btn">Masuk</button>
    </form>
  </div>
</section>

<section id="app" hidden>
  <header>
    <div class="hl"><img src="logo.png" class="hlogo" alt=""><div class="hb2"><b>ARUNIKA</b><small>Manage Better. Grow Further.</small></div></div>
    <button id="prof" aria-label="Akun"><span id="av"></span></button>
  </header>
  <main>
    <select id="pilih" hidden></select>
    <div id="tokobar" hidden><b id="toko"></b></div>
    <div id="view"></div>
  </main>
  <nav>
    <button data-p="home" class="on" aria-label="Beranda"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg><span>Beranda</span></button>
    <button data-p="beli" aria-label="Beli"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10.5l2-8H6.5"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Beli</span></button>
    <button data-p="produksi" aria-label="Produksi"><svg viewBox="0 0 24 24"><path d="M3 20V9l6 4V9l6 4V5h3v15z"/><path d="M6 17h2M11 17h2"/></svg><span>Produksi</span></button>
    <button data-p="jual" aria-label="Jual"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v.01M18 14.5v.01"/></svg><span>Jual</span></button>
    <button data-p="stok" aria-label="Stok"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Stok</span></button>
  </nav>
</section>

<div id="sheet" hidden>
  <div class="sh">
    <button id="tutup" aria-label="Tutup">&times;</button>
    <div class="avbig" id="avb"></div>
    <label class="ganti">Ganti foto<input id="fto" type="file" accept="image/*" hidden></label>
    <label>Nama toko</label>
    <input id="pn" maxlength="40">
    <p class="info" id="pi"></p>
    <button class="btn" id="spn">Simpan</button>
    <details class="pw"><summary>Ganti kata sandi</summary>
      <label>Kata sandi lama</label><input id="pw0" type="password" autocomplete="current-password">
      <label>Kata sandi baru (minimal 8 karakter)</label><input id="pw1" type="password" autocomplete="new-password">
      <label>Ulangi kata sandi baru</label><input id="pw2" type="password" autocomplete="new-password">
      <button class="btn" id="spw">Ubah kata sandi</button>
    </details>
    <button class="btn2" id="pasang" hidden>Pasang di layar utama</button>
    <button class="out" id="keluar">Keluar</button>
  </div>
</div>

<div id="lap" hidden>
  <div class="sh">
    <button class="x" aria-label="Tutup">&times;</button>
    <h3>Unduh laporan</h3>
    <label>Jenis laporan</label>
    <select id="lj">
      <option value="ringkasan">Ringkasan (pemasukan, pengeluaran, laba)</option>
      <option value="penjualan">Penjualan</option>
      <option value="pembelian">Pembelian bahan baku</option>
      <option value="stok">Stok bahan dan produk</option>
    </select>
    <div id="lper">
      <label>Periode</label>
      <select id="lp"><option value="hari">Hari ini</option><option value="7">7 hari terakhir</option><option value="bulan">Bulan ini</option><option value="kustom">Pilih tanggal</option></select>
      <div id="lrg" hidden><input id="ld1" type="date"><input id="ld2" type="date"></div>
    </div>
    <button class="btn wa" id="bwa">Bagikan ke WhatsApp (PDF)</button>
    <div class="dua"><button class="btn2" id="bpdf">Unduh PDF</button><button class="btn2" id="bxls">Unduh Excel</button></div>
  </div>
</div>

<div id="ed" hidden>
  <div class="sh">
    <button class="x" aria-label="Tutup">&times;</button>
    <h3 id="edj"></h3>
    <div id="edf"></div>
    <button class="btn" id="eds">Simpan</button>
    <button class="out" id="edh">Hapus</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
